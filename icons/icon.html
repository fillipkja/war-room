<!DOCTYPE html>
<html><head><style>
  html, body { margin: 0; width: 512px; height: 512px; }
  body {
    background: radial-gradient(circle at 50% 42%, #17171b 0%, #0a0a0c 70%, #060607 100%);
    display: grid; place-items: center;
  }
  svg { display: block; }
</style></head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512">
  <g transform="translate(256,256)">
    <polygon id="outer" fill="rgba(6,6,7,0.4)" stroke="#eb6834" stroke-width="14"/>
    <polygon id="inner" fill="none" stroke="#e8e6dd" stroke-width="3" stroke-opacity="0.85"/>
    <circle r="34" fill="#eb6834"/>
    <circle r="60" fill="none" stroke="#eb6834" stroke-width="6" stroke-opacity="0.45"/>
    <circle r="86" fill="none" stroke="#eb6834" stroke-width="3" stroke-opacity="0.2"/>
    <line x1="-150" y1="0" x2="-96" y2="0" stroke="#e8e6dd" stroke-width="5" stroke-opacity="0.6"/>
    <line x1="96" y1="0" x2="150" y2="0" stroke="#e8e6dd" stroke-width="5" stroke-opacity="0.6"/>
    <line x1="0" y1="-150" x2="0" y2="-96" stroke="#e8e6dd" stroke-width="5" stroke-opacity="0.6"/>
    <line x1="0" y1="96" x2="0" y2="150" stroke="#e8e6dd" stroke-width="5" stroke-opacity="0.6"/>
  </g>
  <script>
    const pts = r => Array.from({length: 10}, (_, i) => {
      const a = (-90 + i * 36) * Math.PI / 180;
      return `${r * Math.cos(a)},${r * Math.sin(a)}`;
    }).join(" ");
    document.getElementById("outer").setAttribute("points", pts(196));
    document.getElementById("inner").setAttribute("points", pts(178));
  </script>
</svg>
</body></html>
