<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>War Room — Daily Geopolitical Brief</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#060607" />
<link rel="icon" type="image/png" href="icons/icon-192.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="War Room" />
<style>
  :root {
    color-scheme: dark;
    --page:            #060607;
    --ocean:           #0a0a0b;
    --land:            #767672;
    --land-stroke:     #504f4b;
    --text-primary:    #ffffff;
    --text-secondary:  #c3c2b7;
    --text-muted:      #898781;
    --hairline:        rgba(255,255,255,0.14);
    --grid:            #232326;
    /* NetWatch-style brand accents */
    --accent:          #eb6834;   /* orange — chrome, headline, chips */
    --accent-2:        #c98500;   /* gold — inner frame line */
    --highlight:       #d03b3b;   /* red — involved nations on the map */
    --highlight-edge:  #e34948;
    --font: system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--page);
    color: var(--text-primary);
    font-family: var(--font);
    display: grid;
    place-items: center;
  }

  /* ── The vertical 9:16 "video" frame ─────────────────── */
  .frame {
    position: relative;
    height: 100vh;
    aspect-ratio: 9 / 16;
    max-width: 100vw;
    background: var(--ocean);
    overflow: hidden;
    box-shadow: 0 0 90px rgba(235,104,52,0.08), 0 0 2px rgba(255,255,255,0.14);
  }
  @media (max-aspect-ratio: 9/16) {
    .frame { height: auto; width: 100vw; aspect-ratio: 9 / 16; }
  }

  svg#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .country { fill: var(--land); stroke: var(--land-stroke); }
  .graticule { fill: none; stroke: var(--grid); stroke-opacity: 0.3; }
  .sphere { fill: var(--ocean); }

  /* film grain + vignette over the map, under the chrome */
  .grain {
    position: absolute; inset: 0; z-index: 3; pointer-events: none;
    opacity: 0.5;
    background-image:
      radial-gradient(ellipse at 50% 38%, transparent 45%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.85) 100%);
  }
  .grain::after {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-conic-gradient(rgba(255,255,255,0.015) 0% 25%, transparent 0% 50%);
    background-size: 3px 3px;
  }

  .country-label {
    fill: var(--text-primary);
    font-family: var(--font);
    font-weight: 700;
    letter-spacing: 0.22em;
    text-anchor: middle;
    paint-order: stroke;
    stroke: rgba(6,6,7,0.85);
    pointer-events: none;
  }
  .marker-label {
    fill: var(--text-secondary);
    font-family: var(--mono);
    letter-spacing: 0.10em;
    paint-order: stroke;
    stroke: rgba(6,6,7,0.9);
    pointer-events: none;
  }
  @keyframes pulse {
    0%   { r: 4;  opacity: 0.9; }
    70%  { r: 18; opacity: 0; }
    100% { r: 18; opacity: 0; }
  }
  .pulse-ring { animation: pulse 2.2s ease-out infinite; }

  .scrim-bottom {
    position: absolute; left: 0; right: 0; bottom: 0; height: 52%;
    background: linear-gradient(to top, rgba(6,6,7,0.97) 24%, rgba(6,6,7,0.75) 55%, transparent);
    pointer-events: none; z-index: 5;
  }

  /* ── Top chrome ──────────────────────────────────────── */
  .segments {
    position: absolute; top: 0; left: 0; right: 0; z-index: 12;
    display: flex; gap: 3px; padding: 6px 8px 0;
  }
  .segments .seg {
    flex: 1; height: 2px; border-radius: 1px;
    background: rgba(255,255,255,0.18); overflow: hidden;
  }
  .segments .seg > i { display: block; height: 100%; width: 0%; background: var(--accent); }
  .segments .seg.done > i { width: 100%; background: rgba(255,255,255,0.55); }

  .datestamp {
    position: absolute; top: 26px; left: 18px; z-index: 12;
    display: flex; align-items: center; gap: 9px;
    font-family: var(--mono); font-size: 15px; font-weight: 700;
    letter-spacing: 0.06em; color: var(--accent);
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .datestamp .glyph { font-size: 11px; opacity: 0.85; letter-spacing: 0; }

  .logo {
    position: absolute; top: 22px; right: 16px; z-index: 12;
    display: flex; align-items: center; gap: 8px;
    opacity: 0.55; text-align: right;
  }
  .logo .mark {
    width: 30px; height: 30px; border-radius: 50%;
    border: 1.5px solid var(--text-secondary);
    display: grid; place-items: center;
    font-size: 12px; color: var(--text-secondary);
  }
  .logo .word { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; line-height: 1.35; color: var(--text-secondary); }

  .counter {
    position: absolute; top: 64px; right: 17px; z-index: 12;
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.12em;
    color: var(--text-muted); text-align: right;
    text-shadow: 0 1px 6px rgba(0,0,0,0.9);
  }

  /* ── Nation badges (decagon emblems, anchored on the map) ── */
  .badge-g { pointer-events: none; transition: opacity 0.45s ease; }
  .marker { transition: opacity 0.35s ease; animation: mfade 0.5s ease; }
  @keyframes mfade { from { opacity: 0; } }
  .badge-g.exiting, .marker.exiting { opacity: 0 !important; }
  .badge-g .b-frame { fill: rgba(6,6,7,0.55); stroke-width: 2; }
  .badge-g .b-inner { fill: none; stroke: #e8e6dd; stroke-width: 0.8; stroke-opacity: 0.8; }
  .badge-g text {
    fill: var(--text-primary); font-family: var(--font);
    font-weight: 800; letter-spacing: 0.26em; text-anchor: middle;
    paint-order: stroke; stroke: rgba(6,6,7,0.9); stroke-width: 3;
  }
  .badge-g image {
    filter: grayscale(1) brightness(1.7) drop-shadow(0 4px 10px rgba(0,0,0,0.8));
  }

  /* ── Story block (lower third, left-aligned) ─────────── */
  .story {
    position: absolute; left: 20px; right: 20px; bottom: 46px; z-index: 10;
    opacity: 0; transform: translateY(14px);
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .story.show { opacity: 1; transform: translateY(0); }

  .chips { display: flex; align-items: center; gap: 10px; }
  .chip-breaking {
    font-family: var(--mono);
    font-size: 13px; font-weight: 800; letter-spacing: 0.12em;
    color: #0b0b0b;
    background: linear-gradient(90deg, var(--accent) 0%, #f6a03c 85%, #fcd39a 100%);
    border: 1px solid rgba(255,255,255,0.35);
    padding: 4px 14px;
  }
  .chip-when {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.14em;
    color: var(--text-secondary);
  }

  .story h2 {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 31px; font-weight: 800; line-height: 1.14;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    color: var(--text-primary);
    text-shadow: 0 2px 18px rgba(0,0,0,0.95);
    position: relative;
    padding-left: 16px;
  }
  .story h2 em { color: var(--accent); font-style: normal; }
  .story h2::before {
    content: "▸";
    position: absolute; left: 0; top: 6px;
    font-size: 14px; color: var(--accent);
  }
  .story .rule {
    margin-top: 10px; height: 1px;
    background: linear-gradient(90deg, var(--accent) 0%, rgba(235,104,52,0.25) 100%);
  }
  .story .brief {
    margin-top: 10px;
    font-size: 13.5px; line-height: 1.55; color: var(--text-secondary);
    text-shadow: 0 1px 8px rgba(0,0,0,0.9);
  }
  .story .brief b {
    font-family: var(--mono); color: var(--accent); font-size: 12.5px;
    letter-spacing: 0.03em;
  }
  .story .meta { margin-top: 13px; display: flex; align-items: center; gap: 12px; }
  .source-pill {
    display: inline-flex; align-items: center; gap: 8px;
    border: 1px solid var(--hairline); border-radius: 999px;
    padding: 4px 13px;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.05em;
    color: var(--text-muted);
  }
  .source-pill b { color: var(--text-primary); font-weight: 700; }
  /* ── Rail & tap zones ────────────────────────────────── */
  .rail {
    position: absolute; right: 12px; bottom: 14px; z-index: 14;
    display: flex; gap: 8px;
  }
  .rail button {
    width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--hairline);
    background: rgba(22,22,26,0.75);
    color: var(--text-primary);
    font-size: 14px; cursor: pointer;
    backdrop-filter: blur(6px);
    display: grid; place-items: center;
    font-family: var(--font);
  }
  .rail button:hover { border-color: rgba(255,255,255,0.35); }
  .rail button.on { border-color: var(--accent); color: var(--accent); }

  .tap { position: absolute; top: 15%; bottom: 20%; width: 30%; z-index: 8; cursor: pointer; }
  .tap.left { left: 0; } .tap.right { right: 0; }

  /* ── Sources overlay ─────────────────────────────────── */
  .sources-panel {
    position: absolute; inset: auto 14px 66px 14px; z-index: 20;
    background: rgba(16,16,19,0.97);
    border: 1px solid var(--hairline); border-radius: 10px;
    padding: 14px 16px; display: none;
  }
  .sources-panel.open { display: block; }
  .sources-panel h3 {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em;
    color: var(--accent); margin-bottom: 8px;
  }
  .sources-panel a {
    display: block; color: var(--text-secondary); font-size: 12px;
    line-height: 1.9; text-decoration: none;
  }
  .sources-panel a:hover { color: var(--text-primary); }
  .sources-panel .note { margin-top: 8px; font-size: 10px; color: var(--text-muted); line-height: 1.5; }
</style>
</head>
<body>
  <div class="frame" id="frame">
    <svg id="map"></svg>
    <div class="grain"></div>
    <div class="scrim-bottom"></div>

    <div class="segments" id="segments"></div>

    <div class="datestamp"><span class="glyph">▚▘</span><span id="brief-date"></span></div>

    <div class="logo">
      <div class="mark">◉</div>
      <div class="word">THE WAR<br/>ROOM</div>
    </div>
    <div class="counter" id="counter">— / —</div>

    <div class="tap left" id="tap-prev" aria-label="Previous story"></div>
    <div class="tap right" id="tap-next" aria-label="Next story"></div>

    <div class="story" id="story">
      <div class="chips">
        <span class="chip-breaking" id="st-cat"></span>
        <span class="chip-when" id="st-when"></span>
      </div>
      <h2 id="st-title"></h2>
      <div class="rule"></div>
      <div class="brief"><b>Brief Look:</b> <span id="st-summary"></span></div>
      <div class="meta">
        <span class="source-pill">Source&nbsp;&nbsp;|&nbsp;&nbsp;<b id="st-source"></b></span>
      </div>
    </div>

    <div class="rail">
      <button id="btn-play" title="Play / pause (space)"></button>
      <button id="btn-sources" title="Sources">ⓘ</button>
    </div>

    <div class="sources-panel" id="sources-panel">
      <h3>SOURCES // OPEN REPORTING</h3>
      <div id="sources-list"></div>
      <div class="note">Unclassified demo compiled from open-source reporting. Tap a source to open it.</div>
    </div>
  </div>

  <script src="vendor/d3.v7.min.js"></script>
  <script src="vendor/topojson-client.min.js"></script>
  <script src="vendor/world-topo.js"></script>
  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js");
    }
  </script>
</body>
</html>
